<body>
  <a class="f-skip" href="#field-main">体験へ進む</a>
  <div class="f-topbar"><header class="f-header">
    <a class="f-brand" href="#">限界散歩・一覧へ</a>
    <div class="f-header-actions"><button id="field-motion" class="f-mini" aria-pressed="false">動き <span>あり</span></button><button id="field-exit" class="f-mini" hidden>一覧へ</button></div>
  </header>
  <div class="f-disclosure">高専祭・学生制作の架空体験です。学校の手続き案内ではありません。</div></div>
  <main id="field-main" tabindex="-1"></main>
  <footer class="f-footer"><p>限界散歩 / 高専祭向け・学生制作の試作</p></footer>
  <noscript><p class="f-noscript">この体験にはJavaScriptが必要です。</p></noscript>
<script>
/* Fictional, browser-local QR booth scenarios. No credentials, network, or device changes. */
(function () {
  'use strict';
  window.FieldModules = window.FieldModules || {};
  var clamp = function (value, min, max) { return Math.max(min, Math.min(max, value)); };
  var arrow = '<span aria-hidden="true">↗</span>';
  function setup(container, api, id) {
    var abort = new AbortController();
    var timers = new Set();
    var alive = true;
    var completed = false;
    function on(node, type, callback, options) { node.addEventListener(type, callback, Object.assign({ signal: abort.signal }, options || {})); }
    function stopTimers() { timers.forEach(function (timer) { clearInterval(timer); }); timers.clear(); }
    function quiet() { return Boolean(api.reduced && api.reduced()); }
    function render(html) {
      container.innerHTML = '<div class="scn-root scn-' + id + (quiet() ? ' scn-reduced' : '') + '">' + html + '</div>';
    }
    function sound() { if (alive && api.sound) api.sound(); }
    function focus(selector) { var node = container.querySelector(selector); if (node) node.focus({ preventScroll: true }); }
    function reveal(config) {
      if (!alive || completed) return;
      completed = true;
      stopTimers();
      render('<section class="scn-reveal" tabindex="-1"><div class="scn-result-number">' + config.mark + '</div><span class="scn-kicker">種明かし</span><h2>' + config.title + '</h2><p class="scn-result-line">' + config.line + '</p><div class="scn-evidence">' + config.evidence.map(function (item) { return '<p><span aria-hidden="true">↳</span><span>' + item + '</span></p>'; }).join('') + '</div><div class="scn-one-thing"><span>持ち帰る知識は、1つ。</span><strong>' + config.lesson + '</strong></div><p class="scn-afterthought">' + config.afterthought + '</p><button type="button" class="f-button scn-wide scn-finish">持ち帰った。次の展示へ ' + arrow + '</button></section>');
      on(container.querySelector('.scn-finish'), 'click', function () { if (alive) api.home(); });
      sound();
      api.complete(id);
      focus('.scn-reveal');
    }
    return {
      on: on, render: render, sound: sound, focus: focus, reveal: reveal, quiet: quiet,
      $: function (selector) { return container.querySelector(selector); },
      every: function (callback, interval) { var timer = setInterval(function () { if (alive && !completed) callback(); }, interval); timers.add(timer); return timer; },
      stopTimers: stopTimers,
      alive: function () { return alive && !completed; },
      close: function () { alive = false; stopTimers(); abort.abort(); }
    };
  }

  window.FieldModules.credit = function (container, api) {
    var game = setup(container, api, 'credit');
    var opened = false;
    game.render('<div class="scn-progress"><span>01 / 誘惑を浴びる</span><span>目安 20秒</span></div><section class="scn-credit-promo"><div class="scn-credit-ribbon">無料単位配布センター <small>（架空）</small></div><div class="scn-credit-stars" aria-hidden="true">✦　✧　✦</div><p class="scn-credit-eyebrow">努力には、休暇を。</p><h2>単位、<br><em>落ちてます。</em></h2><div class="scn-credit-prize"><span>今だけ</span><strong>8</strong><b>単位</b><i>0円</i></div><p class="scn-credit-copy">レポートなし。試験なし。<br>根拠も、いまのところなし。</p><div class="scn-credit-ticket"><span>架空の配布券</span><strong>単位配布券</strong><small>※実際の単位は増えません。景気のよい絵です。</small></div><button type="button" class="f-button scn-wide scn-credit-claim">架空の8単位を受け取る ' + arrow + '</button><button type="button" class="scn-plain-button scn-credit-cautious">うますぎる。宛先から見てみる</button></section>');
    function claim(cautious) {
      if (opened || !game.alive()) return;
      opened = true;
      game.sound();
      game.render('<div class="scn-progress"><span>02 / 受け取り条件を見る</span><span>単位は、まだ0</span></div><section class="scn-credit-request"><span class="scn-kicker">THE SMALL PRINT GOT INTERESTING.</span><h2>先に、こちらを<br>教えてください。</h2><p class="scn-credit-request-lead">配布窓口が急に欲しがり始めたもの。</p><button type="button" class="scn-url-card scn-credit-url" aria-expanded="false"><span>リンク先のURLを確認 ' + arrow + '</span><strong>tan-i-present.example</strong><small>完全な宛先を見る</small></button><div class="scn-url-detail" hidden><code>https://tan-i-present.example/claim</code><p>これは架空の宛先。「単位配布」という名前や見た目だけでは、学校の公式窓口か確認できません。</p></div><div class="scn-credential-demand"><span>受け取り条件</span><strong>学校のログイン用<br>パスワード</strong><div class="scn-fake-secret" aria-hidden="true">？ ？ ？ ？ ？ ？</div><small>この体験には入力欄はありません。</small></div><p class="scn-choice-prompt">ここまで来た。どうする？</p><div class="scn-choice-stack"><button type="button" class="f-button scn-credit-stop">単位と関係ある？ ここで止まる</button><button type="button" class="f-secondary scn-credit-continue">受け取りに必要そう。先へ進む</button></div><p class="scn-microcopy">どちらを選んでも、次は種明かしです。</p></section>');
      var detail = game.$('.scn-url-detail');
      function showUrl() { detail.hidden = !detail.hidden; game.$('.scn-credit-url').setAttribute('aria-expanded', String(!detail.hidden)); game.sound(); }
      game.on(game.$('.scn-credit-url'), 'click', showUrl);
      if (cautious) { detail.hidden = false; game.$('.scn-credit-url').setAttribute('aria-expanded', 'true'); }
      function finish(stopped) {
        game.reveal({
          mark: '単位 ＋0',
          title: stopped ? '単位より先に、<br>要求の変化を見抜いた。' : '景品は単位。<br>狙いは、別のところ。',
          line: stopped ? '「もらえるもの」から「渡すもの」へ、視点が切り替わりました。' : 'ごほうびに目が行くのは自然です。今回は、受け取り条件が罠でした。',
          evidence: ['<b>宛先：</b>表示名やデザインだけでは、公式窓口か分かりません。URLも確認材料に。', '<b>要求：</b>架空の景品を入口に、学校のパスワードを渡させようとする仕掛けでした。'],
          lesson: 'うまい話の入力前に、公式の入口から確かめる。',
          afterthought: '現実の単位は、現実の手続きで。非常に残念なお知らせです。'
        });
      }
      game.on(game.$('.scn-credit-stop'), 'click', function () { finish(true); });
      game.on(game.$('.scn-credit-continue'), 'click', function () { finish(false); });
      game.focus('.scn-credit-url');
    }
    game.on(game.$('.scn-credit-claim'), 'click', function () { claim(false); });
    game.on(game.$('.scn-credit-cautious'), 'click', function () { claim(true); });
    return game.close;
  };

  window.FieldModules.update = function (container, api) {
    var game = setup(container, api, 'update');
    var remaining = 18;
    var selected = false;
    game.render('<div class="scn-progress"><span>01 / 架空の端末「脳内PC」</span><span>目安 20秒</span></div><section class="scn-update-console"><div class="scn-terminal-bar"><span class="scn-terminal-lights" aria-hidden="true"><i></i><i></i><i></i></span><strong>正気OS / 架空の通知</strong><span>×</span></div><div class="scn-update-body"><span class="scn-update-badge">緊急度：自称</span><svg class="scn-update-icon" viewBox="0 0 180 120" aria-hidden="true"><path d="M90 9L173 108H7Z" fill="#d7ff3f" stroke="#d7ff3f" stroke-width="3" stroke-linejoin="round"/><path d="M84 43H96L94 76H86Z" fill="#191a17"/><circle cx="90" cy="91" r="6" fill="#191a17"/></svg><h2>正気OS<br>緊急更新</h2><p class="scn-update-message">このままでは、<strong>正気のままです。</strong><br>今すぐ「正気パッチ」を適用してください。</p><div class="scn-update-clock"><span>なぜか急がされる残り時間</span><strong class="scn-clock-value">00:18</strong><small class="scn-clock-caption">期限の根拠：画面がそう言っている</small></div><div class="scn-update-filename"><span>推奨ファイル</span><code>shoki_patch_FINAL_final.exe</code></div><div class="scn-choice-stack"><button type="button" class="f-button scn-update-now">急いで、ここから更新する ' + arrow + '</button><button type="button" class="f-secondary scn-update-official">いったん閉じて、公式の設定から確認</button></div></div></section><p class="scn-microcopy">架空のOSの遊びです。端末の状態を診断したり、更新ファイルを配布したりしません。</p>');
    game.every(function () {
      remaining = Math.max(0, remaining - 1);
      game.$('.scn-clock-value').textContent = '00:' + String(remaining).padStart(2, '0');
      if (remaining === 0) {
        game.$('.scn-clock-caption').textContent = '0秒になりました。画面の勢いだけでした。';
        game.stopTimers();
      }
    }, 1000);
    function finish(official) {
      if (selected || !game.alive()) return;
      selected = true;
      game.stopTimers();
      game.sound();
      if (!official) { reveal(false); return; }
      game.render('<div class="scn-progress"><span>02 / 確認する入口を選び直す</span><span>落ち着いてきた</span></div><section class="scn-settings"><span class="scn-settings-icon" aria-hidden="true">⚙</span><span class="scn-kicker">正気OS / 架空の公式設定</span><h2>設定から、確認。</h2><div class="scn-settings-breadcrumb">設定 <span>›</span> システム <span>›</span> 更新</div><div class="scn-settings-row"><span>現在の状態</span><strong>架空の確認画面です</strong></div><div class="scn-settings-row"><span>さっきのページ</span><strong>更新の必要性を、ここでは確認できません</strong></div><p>見知らぬ通知の中のボタンを離れて、<b>普段使うOS・アプリの設定</b>から確認する流れです。</p><button type="button" class="f-button scn-wide scn-update-explain">さっきの緊急通知、何だった？ ' + arrow + '</button></section>');
      game.on(game.$('.scn-update-explain'), 'click', function () { reveal(true); });
      game.focus('.scn-update-explain');
    }
    function reveal(official) {
      game.reveal({
        mark: '緊急度 −99',
        title: official ? '更新より先に、<br>入口を更新した。' : 'カウントダウンは、<br>発信元の証明にならない。',
        line: official ? '「急げ」という声から一歩離れて、確認する場所を自分で選べました。' : '「今すぐ」は、考える時間を奪うためにも使えます。派手な警告だけでは、本物か分かりません。',
        evidence: ['この通知は<b>架空のページによる誘導</b>。端末の感染や不具合を確認したものではありません。', '正規の更新が必要な場合もあります。<b>通知内のリンクに頼らず、普段の設定画面から</b>確かめます。'],
        lesson: '見知らぬ更新通知は、公式の設定画面から確認する。',
        afterthought: '正気はアップデート済み。パッチファイルは、出番なし。'
      });
    }
    game.on(game.$('.scn-update-now'), 'click', function () { finish(false); });
    game.on(game.$('.scn-update-official'), 'click', function () { finish(true); });
    return game.close;
  };

  window.FieldModules.wifi = function (container, api) {
    var game = setup(container, api, 'wifi');
    var connected = false;
    game.render('<div class="scn-progress"><span>01 / 無料の電波を発見</span><span>目安 20秒</span></div><section class="scn-wifi-poster"><div class="scn-wifi-poster-top"><strong>無料Wi-Fi</strong><span>架空の接続案内</span></div><svg class="scn-wifi-symbol" viewBox="0 0 220 150" aria-hidden="true"><path d="M18 44Q110-31 202 44M45 77Q110 23 175 77M75 109Q110 80 145 109" fill="none" stroke="#191a17" stroke-width="17" stroke-linecap="round"/><circle cx="110" cy="136" r="11" fill="#191a17"/></svg><h2>最強無料<br>Wi-Fi</h2><p class="scn-wifi-tagline">電波は強い。<br>要求は、もっと強い。</p><div class="scn-wifi-specs"><span>SSID</span><strong>PUDDING_FREE<br><small>（架空）</small></strong><span>公称速度</span><strong>気合い 5本</strong></div><button type="button" class="f-button scn-wide scn-wifi-open">架空の接続案内を見る ' + arrow + '</button></section>');
    function open() {
      if (connected || !game.alive()) return;
      connected = true; game.sound();
      game.render('<div class="scn-progress"><span>02 / 接続の条件を点検</span><span>実際には接続しません</span></div><section class="scn-wifi-portal"><div class="scn-wifi-ticket-header"><span aria-hidden="true">⌁</span><strong>PUDDING_FREE</strong><small>架空のWi-Fi案内ページ</small></div><h2>つなぐだけ、<br>のはずですが。</h2><p>案内ページに、こんな項目が並んでいました。<br><strong>最も立ち止まって確認したい項目</strong>を選んでください。</p><div class="scn-wifi-options"><button type="button" data-scn-wifi="ssid"><span>01 / ネットワーク名</span><strong>PUDDING_FREE</strong><small>SSIDが長い</small></button><button type="button" data-scn-wifi="password"><span>02 / 接続前の要求</span><strong>学校メールの<br>パスワードを入力</strong><small>別サービスの認証情報</small></button><button type="button" data-scn-wifi="signal"><span>03 / 接続品質</span><strong>電波表示が5本</strong><small>アンテナが元気</small></button></div><p class="scn-microcopy">文字はすべて固定表示。パスワードの入力欄はありません。</p></section>');
      container.querySelectorAll('[data-scn-wifi]').forEach(function (button) {
        game.on(button, 'click', function () {
          var correct = button.dataset.scnWifi === 'password';
          game.reveal({
            mark: '電波 ≠ 信頼',
            title: correct ? '電波よりも、<br>要求を見ていた。' : '強い電波に、<br>強い要求が混ざっていた。',
            line: correct ? '接続の案内なのに、別サービスの鍵を欲しがっている。そこが確認ポイントです。' : '今回の確認ポイントは「学校メールのパスワード」。名前の長さやアンテナの本数ではありません。',
            evidence: ['<b>Wi-Fi専用の接続情報</b>と、メールなど<b>別サービスのパスワード</b>を区別します。', '正規の認証方法は提供元によって違います。不明なページで渡す前に、<b>会場の案内や運営に確認</b>します。'],
            lesson: 'Wi-Fi案内で別サービスのパスワードを求められたら、提供元に確認する。',
            afterthought: 'アンテナが5本あっても、信用の残高は表示されません。'
          });
        });
      });
      game.focus('[data-scn-wifi="ssid"]');
    }
    game.on(game.$('.scn-wifi-open'), 'click', open);
    return game.close;
  };

  function decorativeCode(seed) {
    var blocks = '';
    for (var y = 0; y < 9; y++) {
      for (var x = 0; x < 9; x++) {
        if ((x * 11 + y * 7 + x * y + seed) % 5 < 2) blocks += '<rect x="' + (x * 9 + 7) + '" y="' + (y * 9 + 7) + '" width="7" height="7" rx="1"/>';
      }
    }
    return '<svg viewBox="0 0 95 95" aria-hidden="true"><rect width="95" height="95" fill="#fffef9"/><g fill="#191a17">' + blocks + '</g><rect x="30" y="34" width="35" height="27" rx="3" fill="#fffef9"/><text x="47.5" y="53" text-anchor="middle" font-size="13" font-weight="900" fill="#191a17">QR?</text></svg>';
  }
  window.FieldModules.sticker = function (container, api) {
    var game = setup(container, api, 'sticker');
    var peel = 0;
    var revealed = false;
    var drag = null;
    game.render('<div class="scn-progress"><span>01 / 掲示物を観察</span><span>目安 20秒</span></div><section class="scn-sticker-scene"><div class="scn-sticker-heading"><span class="scn-kicker">貼り紙を見てみよう</span><h2>このQR、<br>二枚あります。</h2><p>角が、少し浮いています。<br><strong>画面の上の紙</strong>をめくってみてください。</p></div><div class="scn-noticeboard"><div class="scn-tape scn-tape-one" aria-hidden="true"></div><div class="scn-tape scn-tape-two" aria-hidden="true"></div><div class="scn-paper-poster"><span class="scn-poster-label">空想高専祭 / 架空の掲示</span><h3>会場マップはこちら</h3><div class="scn-layer-window"><div class="scn-sticker-bottom"><span>下に印刷された案内</span>' + decorativeCode(3) + '<strong>展示マップ</strong><code>map-info.example</code></div><div class="scn-sticker-top"><span>最新マップに変更しました</span>' + decorativeCode(9) + '<strong>今だけ特典つき</strong><code>bonus-ticket.example</code><span class="scn-paper-corner" aria-hidden="true">↗</span></div></div><p class="scn-poster-footnote">コードは画面用の模様です。</p></div></div><label class="scn-peel-label" for="scn-peel-range">上の紙をめくる <output class="scn-peel-value" for="scn-peel-range">0%</output></label><input id="scn-peel-range" class="scn-peel-range" type="range" min="0" max="100" step="1" value="0"><button type="button" class="f-secondary scn-wide scn-peel-button">端をつまんで、めくる ' + arrow + '</button><p class="scn-peel-status" role="status" aria-live="polite">紙をドラッグ、またはつまみ・ボタンでめくれます。</p><div class="scn-sticker-decision" hidden><div class="scn-url-comparison"><span>上の紙 <b>bonus-ticket.example</b></span><span>下の印刷 <b>map-info.example</b></span></div><p><strong>同じマップ案内なのに、宛先が違う。</strong><br>ここで、どうしますか？</p><button type="button" class="f-button scn-wide scn-sticker-ask">開く前に、掲示した人へ確認</button><button type="button" class="scn-plain-button scn-sticker-trust">上の紙が新しそう。そのまま進む</button></div></section>');
    var topPaper = game.$('.scn-sticker-top');
    var slider = game.$('#scn-peel-range');
    function setPeel(value) {
      if (!game.alive()) return;
      peel = clamp(value, 0, 100);
      slider.value = String(Math.round(peel));
      game.$('.scn-peel-value').textContent = Math.round(peel) + '%';
      topPaper.style.transform = 'translate(' + (peel * .78) + '%, ' + (-peel * .21) + '%) rotate(' + (peel * .22) + 'deg)';
      topPaper.style.opacity = String(1 - peel * .0065);
      topPaper.style.transition = game.quiet() || drag ? 'none' : '';
      if (peel >= 75 && !revealed) {
        revealed = true;
        game.$('.scn-sticker-decision').hidden = false;
        game.$('.scn-peel-status').textContent = '下にも案内がありました。上と下で、宛先が違います。';
        game.$('.scn-peel-button').textContent = 'もう一度めくって見る ↗';
        game.sound();
      } else if (!revealed) game.$('.scn-peel-status').textContent = peel >= 30 ? 'もう少し。下に、別の文字が見えてきました。' : '紙をドラッグ、またはつまみ・ボタンでめくれます。';
    }
    game.on(slider, 'input', function () { setPeel(Number(slider.value)); });
    game.on(game.$('.scn-peel-button'), 'click', function () { setPeel(100); game.focus('.scn-sticker-ask'); });
    game.on(topPaper, 'pointerdown', function (event) {
      if (event.button !== 0 || !game.alive()) return;
      event.preventDefault();
      drag = { id: event.pointerId, x: event.clientX, y: event.clientY, initial: peel };
      try { topPaper.setPointerCapture(event.pointerId); } catch (_) {}
    });
    game.on(topPaper, 'pointermove', function (event) {

      }, {signal:abort.signal});
      const endDrag = () => { drag = null; object.classList.remove('cam-is-dragging'); };
      for (const type of ['pointerup','pointercancel','lostpointercapture']) object.addEventListener(type, endDrag, {signal:abort.signal});
    }
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) stopCamera('画面が非表示になったため、カメラを止めました。デモ背景で再開できます。');
      else { syncMotion(); positionObject(); }
    }, {signal:abort.signal});
    window.addEventListener('pagehide', () => stopCamera('ページを離れたため、カメラを止めました。'), {signal:abort.signal});
    window.addEventListener('resize', positionObject, {signal:abort.signal});
    if (typeof ResizeObserver !== 'undefined') { resizeObserver = new ResizeObserver(positionObject); resizeObserver.observe(stage); }
    const motionTimer = setInterval(syncMotion, 350);
    syncMotion();
    positionObject();
    return function () {
      alive = false;
      drag = null;
      stopCamera();
      abort.abort();
      clearInterval(motionTimer);
      cancelAnimationFrame(flowerFrame);
      if (resizeObserver) resizeObserver.disconnect();
    };
  }
  window.FieldModules.unit = (container, api) => mountCameraExperience(container, api, 'unit');
  window.FieldModules.reason = (container, api) => mountCameraExperience(container, api, 'reason');
}());

</script>
<script>
(() => {
  'use strict';
  const entries = [
    {id:'credit', type:'security', time:'約20秒', title:'無料単位配布センター', description:'無料で8単位もらえるらしい。そんなわけはない。'},
    {id:'update', type:'security', time:'約20秒', title:'正気OSの緊急更新', description:'今すぐ更新しないと正気のままです、と急かされる。'},
    {id:'wifi', type:'security', time:'約20秒', title:'最強無料Wi-Fi', description:'電波は強い。でも、つなぐための要求が多すぎる。'},
    {id:'sticker', type:'security', time:'約20秒', title:'このQR、二枚あります', description:'画面の中の貼り紙をめくる。下にも何かある。'},
    {id:'unit', type:'camera', time:'約30秒', title:'空中の単位をつかまえる', description:'単位が浮いているので集める。履修には反映されません。'},
    {id:'reason', type:'camera', time:'約30秒', title:'ここに理性ねむる', description:'景色の中に理性の墓を置いて、供養する。'}
  ];
  const main = document.getElementById('field-main');
  const exit = document.getElementById('field-exit');
  const motionButton = document.getElementById('field-motion');
  let reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let cleanup = null, active = null;
  function setMotion() {
    document.documentElement.classList.toggle('reduce-motion', reduced);
    motionButton.setAttribute('aria-pressed', String(reduced));
    motionButton.querySelector('span').textContent = reduced ? '少なめ' : 'あり';
  }
  function stop() {
    if (cleanup) { try { cleanup(); } catch (error) { console.error(error); } cleanup = null; }
  }
  function home() { if (location.hash) location.hash = ''; else renderHome(); }
  function list(type) {
    return '<ol class="f-list">' + entries.filter(x => x.type === type).map(x =>
      `<li><a href="#${x.id}" data-scene="${x.id}">${x.title}</a> <small>（${x.time}）</small><p>${x.description}</p></li>`
    ).join('') + '</ol>';
  }
  function renderHome() {
    stop(); active = null; exit.hidden = true;
    document.title = '限界散歩 | 高専祭のQRあそび';
    main.innerHTML = `<h1>限界散歩</h1>
      <p>高専祭の会場に置くQRから遊べる、短い体験です。<br>好きなものを1つだけでもどうぞ。全部回る必要はありません。</p>
      <h2>ちょっと怪しいページ</h2>
      <p>変な案内に付き合ってみると、最後に種明かしがあります。</p>
      ${list('security')}
      <h2>カメラで遊ぶ</h2>
      <p>スマホの景色に文字や絵を重ねます。カメラを使わず、デモ背景でも遊べます。</p>
      ${list('camera')}
      <section class="f-memo"><h2>ちょっとだけ覚えて帰ること</h2>
      <ul><li>リンクを開く前に、宛先を確認する。</li><li>急かされたら、普段使う公式の入口から確かめる。</li><li>入力や権限が、その目的に本当に必要か考える。</li></ul>
      <p>URLを見ただけで安全と判断できるわけではありません。この展示の画面やサービスは架空です。</p></section>
      <details class="f-sources"><summary>参考にした資料</summary><ul>
      <li><a href="https://www.ipa.go.jp/about/ipanews/ipanews202411.html" target="_blank" rel="noopener noreferrer">IPA：フィッシング詐欺にご用心</a></li>
      <li><a href="https://consumer.ftc.gov/consumer-alerts/2023/12/scammers-hide-harmful-links-qr-codes-steal-your-information" target="_blank" rel="noopener noreferrer">FTC：QRコードのリンクを開く前に</a></li>
      <li><a href="https://consumer.ftc.gov/consumer-alerts/2026/09/see-qr-code-parked-somewhere-dont-scan-ityet" target="_blank" rel="noopener noreferrer">FTC：QRの上貼りに注意</a></li></ul></details>`;
  }
  function mount(id) {
    const data = entries.find(x => x.id === id);
    if (!data) { renderHome(); return; }
    stop(); active = id; exit.hidden = false;
    document.title = data.title + ' | 限界散歩';
    main.innerHTML = `<section class="f-stage-shell"><div class="f-stage-titlebar"><h1>${data.title}</h1><button class="f-mini" data-field-restart>もう一度</button></div><div id="field-stage"></div></section>`;
    const host = document.getElementById('field-stage');
    try {
      if (!window.FieldModules?.[id]) throw Error('Field module not loaded: ' + id);
      cleanup = window.FieldModules[id](host, {reduced: () => reduced, complete: done => { if (active === done) main.dataset.completed = done; }, home, sound: () => {}});
    } catch (error) {
      console.error(error);
      host.innerHTML = '<h2>読み込みに失敗しました</h2><p>「もう一度」を押すか、一覧へ戻ってください。</p>';
    }
    window.scrollTo(0, 0); main.focus({preventScroll: true});
  }
  function route() {
    const id = location.hash.slice(1);
    if (id === 'field-main') { main.focus(); return; }
    if (id) mount(id); else { renderHome(); window.scrollTo(0, 0); }
  }
  document.addEventListener('click', event => {
    const scene = event.target.closest('[data-scene]');
    if (scene) { event.preventDefault(); if (active === scene.dataset.scene) mount(active); else location.hash = scene.dataset.scene; return; }
    if (event.target.closest('[data-field-restart]') && active) mount(active);
  });
  exit.addEventListener('click', home);
  motionButton.addEventListener('click', () => { reduced = !reduced; setMotion(); });
  window.addEventListener('hashchange', route);
  window.addEventListener('pagehide', stop);
  window.addEventListener('pageshow', event => { if (event.persisted) route(); });
  document.addEventListener('keydown', event => { if (event.key === 'Escape' && active) home(); });
  setMotion(); route();
})();

</script>
